          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Adicionar codigo-fonte da Zoom IA"
          git push

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Zoom-IA.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Zoom-IA-APK
          path: dist/Zoom-IA.apk
          if-no-files-found: error
